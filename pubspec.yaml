name: tina_deskmate
description: Tina Desktop AI Companion
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.0.0

dependencies:
  flutter:
    sdk: flutter
  get: ^4.6.6
  web_socket_channel: ^3.0.0
  camera: ^0.11.1
  permission_handler: ^11.3.1
  http: ^1.2.2
  path_provider: ^2.1.5
  shared_preferences: ^2.3.4
  flutter_tts: ^4.2.0
  flutter_local_notifications: ^18.0.1
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/faces/
    - assets/sounds/
